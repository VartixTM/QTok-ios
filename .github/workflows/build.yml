name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: install theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: install ios sdks
        run: |
          git clone https://github.com/theos/sdks.git $HOME/sdks
          echo "THEOS_SDKS=$HOME/sdks" >> $GITHUB_ENV
          ls $HOME/sdks

      - name: install ldid
        run: brew install ldid

      - name: build package
        run: make package FINALPACKAGE=1

      - name: upload deb
        uses: actions/upload-artifact@v4
        with:
          name: qtok-deb
          path: packages/*.deb
